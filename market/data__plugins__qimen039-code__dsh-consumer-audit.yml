description:
  en: 'Audits a DSH profile for capabilities nothing consumes: it inventories the declared composition rows, scans each installed package for its registration sites, counts how often those tools and skills appear in the session logs, and reports the ones with no observed consumer. Ships a skill that fixes the evidence-chain format for completion claims.'
  zh: '审计 DSH profile 里没有消费者的能力：清点已声明的组成行，扫描每个已安装包的注册点，统计这些工具与 skill 在会话日志里出现的次数，报告从未被观察到消费者的那些；并附一份固定「完成声明」证据链格式的 skill。'
